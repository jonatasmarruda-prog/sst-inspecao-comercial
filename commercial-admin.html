<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel SST Comercial</title><style>body{margin:0;background:#eef2f6;color:#17202b;font-family:Arial}.w{max-width:1100px;margin:auto;padding:18px}.c{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:16px;margin-bottom:14px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.k b{font-size:26px;display:block}.f{display:grid;gap:5px;margin:10px 0}.f input{padding:12px;border:1px solid #cbd5e1;border-radius:9px}.b{border:0;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer}.p{background:#8b1018;color:#fff}.blue{background:#1d4ed8;color:#fff}.green{background:#166534;color:#fff}.danger{background:#991b1b;color:#fff}.soft{background:#e2e8f0;color:#17202b}.hidden{display:none!important}.client{border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin:10px 0}.act{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f1f5f9;font-size:11px;font-weight:900}.mini{font-size:12px;color:#64748b;margin-top:4px}.msg{font-size:12px;color:#991b1b;margin-top:8px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:700px){.g{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="w"><div id="login" class="c"><h2>Painel SST Comercial</h2><p>Área exclusiva do administrador.</p><div class="f"><label>E-mail</label><input id="em" type="email" autocomplete="username"></div><div class="f"><label>Senha</label><input id="pw" type="password" autocomplete="current-password"></div><button id="go" class="b p">Entrar</button><div id="msg" class="msg"></div></div><div id="app" class="hidden"><div class="c top"><div><h2 style="margin:0">Clientes SST</h2><div class="mini">Controle de teste, liberação e bloqueio</div></div><button id="out" class="b soft">Sair</button></div><div class="g"><div class="k"><span>Total</span><b id="kt">0</b></div><div class="k"><span>Teste</span><b id="kr">0</b></div><div class="k"><span>Ativos</span><b id="ka">0</b></div><div class="k"><span>Bloqueados</span><b id="kb">0</b></div></div><div class="c"><input id="q" placeholder="Pesquisar empresa, CNPJ ou e-mail" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px"><div id="list"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./commercial-env.js"></script><script>(()=>{const $=id=>document.getElementById(id),cfg=window.SST_COMMERCIAL_CONFIG||{},sb=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});let all=[];const fmt=v=>{if(!v)return'—';try{return new Date(v).toLocaleString('pt-BR')}catch{return String(v)}};const err=t=>$('msg').textContent=t||'';async function isAdmin(){const u=await sb.auth.getUser();if(u.error||!u.data.user)throw new Error('Faça login.');const r=await sb.rpc('is_sst_platform_admin');if(r.error)throw r.error;if(!r.data)throw new Error('Conta sem permissão de administrador.')}async function load(){await isAdmin();const [c,l,m,p]=await Promise.all([sb.from('companies').select('*').order('created_at',{ascending:false}),sb.from('licenses').select('*'),sb.from('company_members').select('*'),sb.from('profiles').select('*')]);if(c.error||l.error||m.error||p.error)throw(c.error||l.error||m.error||p.error);const lm=new Map((l.data||[]).map(x=>[x.company_id,x])),pm=new Map((p.data||[]).map(x=>[x.user_id,x]));all=(c.data||[]).map(x=>{const own=(m.data||[]).find(y=>y.company_id===x.id&&y.member_role==='owner');return{...x,license:lm.get(x.id)||{},owner:own?pm.get(own.user_id)||{}:{}}});render()}function render(){const q=$('q').value.trim().toLowerCase(),it=all.filter(x=>[x.legal_name,x.trade_name,x.cnpj,x.email,x.owner?.email].join(' ').toLowerCase().includes(q));$('kt').textContent=all.length;$('kr').textContent=all.filter(x=>['trial','demo'].includes(x.license.status)).length;$('ka').textContent=all.filter(x=>x.license.status==='active').length;$('kb').textContent=all.filter(x=>['blocked','expired','pending'].includes(x.license.status)).length;$('list').innerHTML=it.map(x=>'<div class="client" data-id="'+x.id+'"><b>'+(x.trade_name||x.legal_name||'Empresa')+'</b> <span class="pill">'+String(x.license.status||'sem licença').toUpperCase()+'</span><div class="mini">'+(x.legal_name||'')+' • '+(x.cnpj||'Sem CNPJ')+'</div><div class="mini">'+(x.owner?.email||x.email||'Sem e-mail')+'</div><div class="mini">Teste até: '+fmt(x.license.trial_ends_at)+'</div><div class="act"><button class="b blue" data-a="t2">Teste 2 dias</button><button class="b blue" data-a="t3">Teste 3 dias</button><button class="b green" data-a="on">Liberar</button><button class="b danger" data-a="block">Bloquear</button><button class="b soft" data-a="expire">Expirar</button></div></div>').join('')||'<p>Nenhum cliente cadastrado.</p>'}async function lic(id,patch){const r=await sb.from('licenses').update({...patch,updated_at:new Date().toISOString()}).eq('company_id',id);if(r.error)throw r.error;await load()}document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.closest('[data-id]').dataset.id,a=b.dataset.a;try{if(a==='t2'||a==='t3'){const d=a==='t2'?2:3;await lic(id,{status:'trial',trial_started_at:new Date().toISOString(),trial_ends_at:new Date(Date.now()+d*86400000).toISOString(),active_until:null})}else if(a==='on')await lic(id,{status:'active',trial_ends_at:null,active_until:null});else if(a==='block')await lic(id,{status:'blocked'});else if(a==='expire')await lic(id,{status:'expired',trial_ends_at:new Date(0).toISOString(),active_until:new Date(0).toISOString()})}catch(x){alert(x.message||x)}});$('go').onclick=async()=>{try{err('');const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)throw r.error;await isAdmin();$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(x){err(x.message||'Falha no acesso.')}};$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};$('q').oninput=render;(async()=>{try{const s=await sb.auth.getSession();if(s.data.session){await isAdmin();$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}}catch{}})();})();</script></body></html>
