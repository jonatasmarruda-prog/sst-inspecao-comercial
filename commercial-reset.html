<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha • SST</title><style>body{margin:0;font-family:Arial;background:linear-gradient(145deg,#0f172a,#7f1d1d);min-height:100vh;display:grid;place-items:center;padding:18px}.c{width:min(440px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 90px #0008}.c h2{margin:0 0 8px}.c p{color:#64748b;line-height:1.45}.pw{position:relative}.pw input{width:100%;box-sizing:border-box;padding:12px 48px 12px 12px;border:1px solid #cbd5e1;border-radius:10px}.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:#f1f5f9;border-radius:9px;width:38px;height:38px}.b{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px;font-weight:900;background:#8b1018;color:#fff}.b:disabled{opacity:.55}.m{margin-top:10px;font-size:12px;line-height:1.45;min-height:18px}</style></head><body><div class="c"><h2>Redefinir senha</h2><p id="help">Validando seu link de recuperação...</p><div class="pw"><input id="p" type="password" autocomplete="new-password" disabled><button id="e" class="eye" type="button">👁️</button></div><button id="s" class="b" disabled>Salvar nova senha</button><div id="m" class="m"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./commercial-env.js?v=auth04"></script><script>(()=>{const $=id=>document.getElementById(id),cfg=window.SST_COMMERCIAL_CONFIG||{},m=$('m'),help=$('help');function setMsg(t,ok=false){m.textContent=t||'';m.style.color=ok?'#166534':'#991b1b'}if(!cfg.supabaseUrl||!cfg.publishableKey||!window.supabase?.createClient){setMsg('Serviço de autenticação indisponível.');return}const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let ready=false;function enable(){ready=true;$('p').disabled=false;$('s').disabled=false;help.textContent='Crie uma nova senha com pelo menos 8 caracteres.';$('p').focus()}async function check(){const params=new URLSearchParams(location.search);const hash=new URLSearchParams(String(location.hash||'').replace(/^#/,''));const err=params.get('error_description')||hash.get('error_description');if(err){setMsg(decodeURIComponent(err));help.textContent='Este link não pôde ser validado.';return}const {data,error}=await sb.auth.getSession();if(error){setMsg(error.message);return}if(data?.session){enable();return}setMsg('O link de recuperação é inválido ou expirou. Solicite um novo link no login.')}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||(event==='SIGNED_IN'&&session))enable()});$('e').onclick=()=>{const p=$('p'),show=p.type==='password';p.type=show?'text':'password';$('e').textContent=show?'🙈':'👁️'};$('s').onclick=async()=>{const p=$('p').value;if(!ready){setMsg('Aguarde a validação do link.');return}if(p.length<8){setMsg('Use pelo menos 8 caracteres.');return}$('s').disabled=true;$('s').textContent='Salvando...';const{error}=await sb.auth.updateUser({password:p});if(error){setMsg(error.message);$('s').disabled=false;$('s').textContent='Salvar nova senha';return}setMsg('Senha alterada com sucesso. Voltando ao login...',true);await sb.auth.signOut({scope:'local'}).catch(()=>{});setTimeout(()=>location.href='./',900)};setTimeout(check,250)})();</script></body></html>
