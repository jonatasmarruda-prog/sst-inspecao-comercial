<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<title>Acesso • Sistema de Gestão SST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#0f172a;color:#17202b}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#7f1d1d 0,#1e293b 38%,#0f172a 75%)}
.card{width:min(460px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 30px 90px #0009}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:900;margin-bottom:12px}
h1{margin:0 0 8px;font-size:26px}p{margin:0 0 18px;color:#64748b;line-height:1.45}
label{display:block;font-size:12px;font-weight:900;color:#334155;margin:11px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;outline:none}
input:focus{border-color:#8b1018;box-shadow:0 0 0 3px #8b101818}
.pw{position:relative}.pw input{padding-right:52px}
.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:9px;background:#f1f5f9;font-size:18px;cursor:pointer}
button.action{width:100%;padding:13px;border:0;border-radius:11px;font-weight:900;cursor:pointer;margin-top:14px;font-size:15px}
.primary{background:#9f111b;color:#fff}
button:disabled,input:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:20px;font-size:12px;line-height:1.45;margin-top:12px;color:#475569}.err{color:#991b1b}.ok{color:#166534}
.small{margin-top:15px;font-size:11px;text-align:center;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <div class="badge">🔒 ACESSO CONTROLADO</div>
  <h1>Sistema de Gestão SST</h1>
  <p>Digite o Login e a Senha fornecidos pelo administrador.</p>

  <label for="loginField">Login</label>
  <input id="loginField" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Seu login">

  <label for="pass">Senha</label>
  <div class="pw">
    <input id="pass" type="password" autocomplete="current-password" placeholder="Sua senha">
    <button id="eye" class="eye" type="button" aria-label="Mostrar senha">👁️</button>
  </div>

  <button id="loginBtn" class="action primary" type="button">Entrar</button>
  <div id="msg" class="msg">Entre para continuar.</div>
  <div class="small">Sistema Comercial SST • acesso liberado pelo administrador</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
'use strict';
const SB_URL='https://cbyoetsdhohmrpzjrttf.supabase.co';
const SB_KEY='sb_publishable_ODkVvlEdCvEOUEuPCKjOCg_v4RuGkQD';
const RESOLVE_URL=SB_URL+'/functions/v1/sst-commercial-login-resolve';
const $=id=>document.getElementById(id);
const msg=$('msg');

function say(t,k=''){msg.textContent=t||'';msg.className='msg '+k}
function busy(v){['loginField','pass','loginBtn'].forEach(id=>$(id).disabled=!!v);$('loginBtn').textContent=v?'Entrando...':'Entrar'}
async function clearOldCache(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch{}
  try{
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('inspecao-sst-')).map(k=>caches.delete(k)));
    }
  }catch{}
}
if(!window.supabase?.createClient){say('Serviço de acesso indisponível. Atualize a página.','err');return}
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

await clearOldCache();

$('eye').onclick=()=>{
  const p=$('pass'),show=p.type==='password';
  p.type=show?'text':'password';
  $('eye').textContent=show?'🙈':'👁️';
};
$('loginField').oninput=()=>{$('loginField').value=$('loginField').value.toLowerCase().replace(/\s+/g,'')};
$('loginField').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});

$('loginBtn').onclick=async()=>{
  try{
    const login=$('loginField').value.trim().toLowerCase(),password=$('pass').value;
    if(!login||!password)throw new Error('Informe o Login e a Senha.');
    busy(true);say('Validando acesso...');
    const resolve=await Promise.race([
      fetch(RESOLVE_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({login})}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tempo de conexão excedido. Tente novamente.')),12000))
    ]);
    const info=await resolve.json().catch(()=>({}));
    if(!resolve.ok||!info?.ok)throw new Error(info?.message||'Login ou senha incorretos.');

    const result=await Promise.race([
      sb.auth.signInWithPassword({email:info.internalEmail,password}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tempo de conexão excedido. Tente novamente.')),12000))
    ]);
    if(result.error)throw new Error('Login ou senha incorretos.');
    if(!result.data?.session)throw new Error('Não foi possível iniciar a sessão.');

    // Já carrega empresa + licença AQUI, enquanto o login está autenticado.
    // O app recebe o contexto pronto e abre imediatamente, sem "Carregando empresa".
    let bootstrap=null;
    try{
      const uid=result.data.user.id;
      const accessResult=await Promise.race([
        sb.from('sst_access_accounts')
          .select('user_id,company_id,active')
          .eq('user_id',uid)
          .eq('active',true)
          .limit(1)
          .maybeSingle(),
        new Promise((_,reject)=>setTimeout(()=>reject(new Error('context_timeout')),7000))
      ]);
      const access=accessResult?.data||null;
      if(access?.company_id){
        const [companyResult,licenseResult,memberResult]=await Promise.all([
          sb.from('companies').select('*').eq('id',access.company_id).limit(1).maybeSingle(),
          sb.from('licenses').select('*').eq('company_id',access.company_id).limit(1).maybeSingle(),
          sb.from('company_members').select('*')
            .eq('user_id',uid)
            .eq('company_id',access.company_id)
            .eq('active',true)
            .limit(1)
            .maybeSingle()
        ]);
        if(companyResult?.data){
          bootstrap={
            user:{id:uid},
            company:companyResult.data,
            license:licenseResult?.data||null,
            membership:memberResult?.data||{
              user_id:uid,
              company_id:access.company_id,
              member_role:'owner',
              active:true
            },
            created_at:Date.now()
          };
        }
      }
    }catch(e){
      console.warn('[SST BOOTSTRAP LOGIN]',e);
    }

    try{
      sessionStorage.setItem('sst_runtime_access_token',result.data.session.access_token);
      sessionStorage.setItem('sst_runtime_refresh_token',result.data.session.refresh_token);
      sessionStorage.setItem('sst_runtime_created_at',String(Date.now()));
      sessionStorage.setItem('sst_auth_handoff_v1',JSON.stringify({
        access_token:result.data.session.access_token,
        refresh_token:result.data.session.refresh_token,
        created_at:Date.now()
      }));
      if(bootstrap){
        const raw=JSON.stringify(bootstrap);
        sessionStorage.setItem('sst_bootstrap_context_v1',raw);
        try{localStorage.setItem('sst_bootstrap_context_v1',raw)}catch{}
      }
    }catch{}

    say('Acesso liberado. Abrindo o sistema...','ok');
    await clearOldCache();
    location.replace('./app.html?access=ok&v=cipafix01');
  }catch(e){
    busy(false);
    const t=String(e?.message||e||'Não foi possível entrar.');
    say(t.includes('Acesso bloqueado')?t:(t.includes('Tempo de conexão')?t:'Login ou senha incorretos.'),'err');
  }
};

try{
  const prefill=new URLSearchParams(location.search).get('login');
  if(prefill){
    $('loginField').value=String(prefill).trim().toLowerCase().replace(/\s+/g,'');
    $('pass').focus();
  }else{
    $('loginField').focus();
  }
}catch{
  $('loginField').focus();
}
})();
</script>
</body>
</html>
