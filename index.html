<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<title>Acesso • Sistema de Gestão SST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#0f172a;color:#17202b}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#7f1d1d 0,#1e293b 38%,#0f172a 75%)}
.card{width:min(460px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 30px 90px #0009}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:900;margin-bottom:12px}
h1{margin:0 0 8px;font-size:26px}p{margin:0 0 18px;color:#64748b;line-height:1.45}
label{display:block;font-size:12px;font-weight:900;color:#334155;margin:11px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;outline:none}
input:focus{border-color:#8b1018;box-shadow:0 0 0 3px #8b101818}
.pw{position:relative}.pw input{padding-right:52px}
.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:9px;background:#f1f5f9;font-size:18px;cursor:pointer}
button.action{width:100%;padding:13px;border:0;border-radius:11px;font-weight:900;cursor:pointer;margin-top:10px;font-size:15px}
.primary{background:#9f111b;color:#fff}.secondary{background:#e2e8f0;color:#17202b}
button:disabled,input:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:20px;font-size:12px;line-height:1.45;margin-top:12px;color:#475569}.err{color:#991b1b}.ok{color:#166534}
.small{margin-top:15px;font-size:11px;text-align:center;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <div class="badge">🔒 ACESSO CONTROLADO</div>
  <h1>Sistema de Gestão SST</h1>
  <p>Entre com o <b>cadastro já existente</b> no sistema.</p>

  <label for="email">E-mail cadastrado</label>
  <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false">

  <label for="pass">Senha</label>
  <div class="pw">
    <input id="pass" type="password" autocomplete="current-password">
    <button id="eye" class="eye" type="button" aria-label="Mostrar senha">👁️</button>
  </div>

  <button id="login" class="action primary" type="button">Entrar com cadastro existente</button>
  <button id="forgot" class="action secondary" type="button">Esqueci minha senha</button>

  <div id="msg" class="msg">Verificando acesso...</div>
  <div class="small">Sistema Comercial SST • acesso individual por empresa</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
'use strict';
const SB_URL='https://cbyoetsdhohmrpzjrttf.supabase.co';
const SB_KEY='sb_publishable_ODkVvlEdCvEOUEuPCKjOCg_v4RuGkQD';
const $=id=>document.getElementById(id);
const msg=$('msg');

function say(text,kind=''){
  msg.textContent=text||'';
  msg.className='msg '+kind;
}
function busy(on){
  ['email','pass','login','forgot'].forEach(id=>$(id).disabled=!!on);
  $('login').textContent=on?'Entrando...':'Entrar com cadastro existente';
}
function friendly(error){
  const raw=String(error?.message||error||'');
  const low=raw.toLowerCase();
  if(low.includes('invalid login credentials')||low.includes('invalid credentials'))return 'E-mail ou senha incorretos.';
  if(low.includes('email not confirmed'))return 'Este cadastro ainda não foi liberado.';
  if(low.includes('rate limit')||low.includes('too many'))return 'Muitas tentativas em pouco tempo. Tente novamente mais tarde.';
  if(low.includes('failed to fetch')||low.includes('network')||low.includes('load failed'))return 'Falha de conexão. Verifique a internet e tente novamente.';
  return raw||'Não foi possível acessar.';
}
if(!window.supabase?.createClient){
  say('Não foi possível carregar o serviço de acesso. Atualize a página.','err');
  return;
}
const sb=window.supabase.createClient(SB_URL,SB_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});
function goApp(){window.location.href='./app.html';}

$('eye').onclick=()=>{
  const p=$('pass'),show=p.type==='password';
  p.type=show?'text':'password';
  $('eye').textContent=show?'🙈':'👁️';
};
$('login').onclick=async()=>{
  try{
    const email=$('email').value.trim().toLowerCase();
    const password=$('pass').value;
    if(!email||!password)throw new Error('Informe o e-mail cadastrado e a senha.');
    busy(true);say('Validando seu cadastro...');
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data?.session)throw new Error('Não foi possível iniciar a sessão.');
    say('Cadastro reconhecido. Abrindo o sistema...','ok');
    goApp();
  }catch(e){
    busy(false);say(friendly(e),'err');
  }
};
$('forgot').onclick=async()=>{
  try{
    const email=$('email').value.trim().toLowerCase();
    if(!email)throw new Error('Informe primeiro o e-mail cadastrado.');
    busy(true);say('Solicitando recuperação...');
    const redirectTo=new URL('./commercial-reset.html',location.href).href;
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    busy(false);say('Pedido enviado. Verifique sua caixa de entrada e também o Spam.','ok');
  }catch(e){
    busy(false);say(friendly(e),'err');
  }
};
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});

(async()=>{
  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(data?.session){say('Sessão encontrada. Abrindo o sistema...','ok');goApp();return}
    say('Use o cadastro que já existe no sistema.');
    $('email').focus();
  }catch{
    say('Use o cadastro que já existe no sistema.');
    $('email').focus();
  }
})();
})();
</script>
</body>
</html>
