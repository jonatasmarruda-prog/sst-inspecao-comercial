<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<title>Acesso • Sistema de Gestão SST</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#0f172a;color:#17202b}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#7f1d1d 0,#1e293b 38%,#0f172a 75%)}
.card{width:min(460px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 30px 90px #0009}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:900;margin-bottom:12px}
h1{margin:0 0 8px;font-size:26px}p{margin:0 0 18px;color:#64748b;line-height:1.45}
label{display:block;font-size:12px;font-weight:900;color:#334155;margin:11px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;outline:none}
input:focus{border-color:#8b1018;box-shadow:0 0 0 3px #8b101818}
.pw{position:relative}.pw input{padding-right:52px}
.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:9px;background:#f1f5f9;font-size:18px;cursor:pointer}
button.action{width:100%;padding:13px;border:0;border-radius:11px;font-weight:900;cursor:pointer;margin-top:10px;font-size:15px}
.primary{background:#9f111b;color:#fff}.secondary{background:#e2e8f0;color:#17202b}
button:disabled,input:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:20px;font-size:12px;line-height:1.45;margin-top:12px;color:#475569}.err{color:#991b1b}.ok{color:#166534}
.small{margin-top:15px;font-size:11px;text-align:center;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <div class="badge">🔒 ACESSO CONTROLADO</div>
  <h1>Sistema de Gestão SST</h1>
  <p>Entre com seu e-mail e senha para acessar os dados da sua empresa.</p>

  <label for="email">E-mail</label>
  <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false">

  <label for="pass">Senha</label>
  <div class="pw">
    <input id="pass" type="password" autocomplete="current-password">
    <button id="eye" class="eye" type="button" aria-label="Mostrar senha" title="Mostrar senha">👁️</button>
  </div>

  <button id="login" class="action primary" type="button">Entrar</button>
  <button id="create" class="action secondary" type="button">Criar acesso</button>
  <button id="forgot" class="action secondary" type="button">Esqueci minha senha</button>

  <div id="msg" class="msg">Entre para continuar.</div>
  <div class="small">Sistema Comercial SST • acesso individual por empresa</div>
</div>
<script>
(()=>{
'use strict';

const SB_URL='https://cbyoetsdhohmrpzjrttf.supabase.co';
const SB_KEY='sb_publishable_ODkVvlEdCvEOUEuPCKjOCg_v4RuGkQD';
const STORAGE_KEY='sb-cbyoetsdhohmrpzjrttf-auth-token';
const $=id=>document.getElementById(id);

function say(text,kind=''){
  const m=$('msg');
  m.textContent=text||'';
  m.className='msg '+kind;
}
function busy(on,label='Entrando...'){
  ['email','pass','login','create','forgot'].forEach(id=>$(id).disabled=!!on);
  $('login').textContent=on?label:'Entrar';
}
function friendly(raw){
  const s=String(raw||'').toLowerCase();
  if(s.includes('invalid login credentials')||s.includes('invalid credentials'))return 'E-mail ou senha incorretos.';
  if(s.includes('email not confirmed'))return 'Seu e-mail ainda não foi liberado.';
  if(s.includes('rate limit')||s.includes('too many'))return 'Muitas tentativas em pouco tempo. Tente novamente mais tarde.';
  if(s.includes('failed to fetch')||s.includes('network'))return 'Falha de conexão. Verifique a internet e tente novamente.';
  if(s.includes('already')&&s.includes('registered'))return 'Este e-mail já possui cadastro. Use Entrar ou Esqueci minha senha.';
  return raw||'Não foi possível concluir o acesso.';
}
function goApp(){location.replace('./app.html');}
function saveSession(session){
  if(!session?.access_token||!session?.refresh_token)throw new Error('Sessão inválida.');
  if(!session.expires_at&&session.expires_in)session.expires_at=Math.floor(Date.now()/1000)+Number(session.expires_in);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(session));
}
async function signIn(email,password){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY},
    body:JSON.stringify({email,password})
  });
  const out=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(out?.msg||out?.message||out?.error_description||out?.error||'Falha no login.');
  saveSession(out);
  if(out.user?.id){
    fetch(SB_URL+'/rest/v1/profiles?on_conflict=user_id',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SB_KEY,
        'Authorization':'Bearer '+out.access_token,
        'Prefer':'resolution=merge-duplicates'
      },
      body:JSON.stringify([{
        user_id:out.user.id,
        full_name:out.user.user_metadata?.full_name||'',
        email:out.user.email||email,
        updated_at:new Date().toISOString()
      }])
    }).catch(()=>{});
  }
  return out;
}
async function login(){
  try{
    const email=$('email').value.trim().toLowerCase();
    const password=$('pass').value;
    if(!email||!password)throw new Error('Informe e-mail e senha.');
    busy(true,'Entrando...');
    say('Validando acesso...');
    await signIn(email,password);
    say('Acesso liberado. Abrindo o sistema...','ok');
    goApp();
  }catch(e){
    busy(false);
    say(friendly(e?.message),'err');
  }
}
async function create(){
  try{
    const email=$('email').value.trim().toLowerCase();
    const password=$('pass').value;
    if(!email||!password)throw new Error('Informe e-mail e senha.');
    if(password.length<8)throw new Error('A senha precisa ter pelo menos 8 caracteres.');
    busy(true,'Criando acesso...');
    say('Criando seu acesso...');
    const r=await fetch(SB_URL+'/functions/v1/sst-commercial-signup',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY},
      body:JSON.stringify({email,password,fullName:''})
    });
    const out=await r.json().catch(()=>({}));
    if(!r.ok||!out?.ok)throw new Error(out?.message||'Não foi possível criar o acesso.');
    await signIn(email,password);
    say('Acesso criado. Abrindo o sistema...','ok');
    goApp();
  }catch(e){
    busy(false);
    say(friendly(e?.message),'err');
  }
}
let sbPromise=null;
function loadSupabase(){
  if(window.supabase?.createClient)return Promise.resolve(window.supabase);
  if(sbPromise)return sbPromise;
  sbPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.async=true;
    s.onload=()=>resolve(window.supabase);
    s.onerror=()=>reject(new Error('Não foi possível carregar a recuperação de senha.'));
    document.head.appendChild(s);
  });
  return sbPromise;
}
async function forgot(){
  try{
    const email=$('email').value.trim().toLowerCase();
    if(!email)throw new Error('Informe seu e-mail.');
    busy(true,'Enviando...');
    say('Solicitando recuperação...');
    const lib=await loadSupabase();
    const sb=lib.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const redirectTo=new URL('./commercial-reset.html',location.href).href;
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    busy(false);
    say('Se o e-mail estiver cadastrado, o link de redefinição será enviado. Verifique também o Spam.','ok');
  }catch(e){
    busy(false);
    say(friendly(e?.message),'err');
  }
}

$('eye').onclick=()=>{
  const p=$('pass'),show=p.type==='password';
  p.type=show?'text':'password';
  $('eye').textContent=show?'🙈':'👁️';
  $('eye').title=show?'Ocultar senha':'Mostrar senha';
};
$('login').onclick=login;
$('create').onclick=create;
$('forgot').onclick=forgot;
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

try{
  const existing=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(existing?.refresh_token){
    say('Sessão encontrada. Abrindo o sistema...','ok');
    goApp();
  }else{
    $('email').focus();
  }
}catch{
  localStorage.removeItem(STORAGE_KEY);
  $('email').focus();
}
})();
</script>
</body>
</html>
